name: Bot CI

concurrency:
  group: bot-ci-${{ github.ref }}
  cancel-in-progress: true
  
on:
  push:
    branches: [main]
  schedule:
  - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Syntax Check
        run: python -m py_compile $(find . -name "*.py")

      - name: Lint
        run: ruff check . --ignore I001

      - name: Run Bot
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: python main.py
